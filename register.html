<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Ro'yxatdan o'tish - TelePulse (Telepluce) Chat</title>
  <meta name="description" content="TelePulse (Telepluce) orqali yangi hisob yarating va bepul real-time chatdan foydalaning.">
  <meta name="keywords" content="telepluce, telepulse, tele pluce, telepulse register, telepluce royxatdan otish">
  <meta name="robots" content="index, follow">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">

  <div class="auth-card" style="max-width: 480px;">
    <div class="auth-header">
      <div class="auth-logo">
        <i class="fa-solid fa-paper-plane"></i>
      </div>
      <h1 class="auth-title">Ro'yxatdan O'tish</h1>
      <p class="auth-subtitle">TelePulse'da yangi hisob yarating</p>
    </div>

    <div id="error-alert" style="display: none; background: rgba(239, 68, 68, 0.15); color: #ef4444; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px;"></div>

    <form id="register-form">
      <!-- Avatar Upload Picker -->
      <div class="avatar-picker">
        <img id="avatar-preview" class="avatar-preview" src="https://api.dicebear.com/7.x/bottts/svg?seed=TelePulse" alt="Avatar Preview">
        <label for="avatar-input" class="avatar-upload-btn">
          <i class="fa-solid fa-camera"></i> Rasm tanlash
        </label>
        <input type="file" id="avatar-input" accept="image/*" style="display: none;">
      </div>

      <div class="form-group">
        <label class="form-label" for="reg-display-name">Ism va Familiya</label>
        <input type="text" id="reg-display-name" class="form-input" placeholder="Ali Valiyev" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="reg-username">Username (Unikal)</label>
        <div style="position: relative;">
          <span style="position: absolute; left: 14px; top: 12px; color: var(--text-muted);">@</span>
          <input type="text" id="reg-username" class="form-input" style="padding-left: 30px;" placeholder="alivaliyev" requiredPattern="[a-zA-Z0-9_]{3,20}">
        </div>
        <small style="font-size: 11px; color: var(--text-muted); margin-top: 4px; display: block;">Kamida 3 ta belgi (lotin harflari, raqam, _)</small>
      </div>

      <div class="form-group">
        <label class="form-label" for="reg-email">Email Manzil</label>
        <input type="email" id="reg-email" class="form-input" placeholder="email@example.com" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="reg-password">Parol</label>
        <input type="password" id="reg-password" class="form-input" placeholder="Kamida 6 ta belgi" minlength="6" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="reg-bio">Bio (O'zingiz haqingizda)</label>
        <input type="text" id="reg-bio" class="form-input" placeholder="Salom, men TelePulse foydalanuvchisiman!">
      </div>

      <button type="submit" id="btn-register" class="btn-primary">
        <i class="fa-solid fa-user-plus"></i> Ro'yxatdan O'tish
      </button>
    </form>

    <div class="auth-footer">
      Sizda hisob bormi? <a href="login.html">Tizimga kirish</a>
    </div>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
