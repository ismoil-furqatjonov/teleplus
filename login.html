<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Kirish - TelePulse (Telepluce) Chat</title>
  <meta name="description" content="TelePulse (Telepluce) hisobingizga kiring va do'stlaringiz bilan xavfsiz va tezkor muloqotni boshlang.">
  <meta name="keywords" content="telepluce, telepulse, tele pluce, telepulse login, telepluce chat, kirish">
  <meta name="robots" content="index, follow">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">
        <i class="fa-solid fa-paper-plane"></i>
      </div>
      <h1 class="auth-title">TelePulse Chat</h1>
      <p class="auth-subtitle">Hisobingizga kiring va muloqotni boshlang</p>
    </div>

    <div id="error-alert" style="display: none; background: rgba(239, 68, 68, 0.15); color: #ef4444; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px;"></div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="login-email">Email Manzil</label>
        <input type="email" id="login-email" class="form-input" placeholder="email@example.com" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="login-password">Parol</label>
        <input type="password" id="login-password" class="form-input" placeholder="••••••••" required>
      </div>

      <button type="submit" id="btn-login" class="btn-primary">
        <i class="fa-solid fa-right-to-bracket"></i> Tizimga Kirish
      </button>
    </form>

    <div class="auth-footer">
      Hisobingiz yo'qmi? <a href="register.html">Ro'yxatdan o'tish</a>
    </div>

    <div style="margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border-color); text-align: center;">
      <button type="button" id="btn-show-login-qr" class="btn-secondary" style="width: 100%; font-size: 13px;">
        <i class="fa-solid fa-qrcode"></i> Telefondan Kirish (QR Kod)
      </button>
      
      <div id="login-qr-box" style="display: none; margin-top: 16px; animation: fadeIn 0.3s ease-out;">
        <p style="font-size: 12px; color: var(--text-secondary); margin-bottom: 10px;">
          Bir xil Wi-Fi tarmog'idagi telefondan kirish uchun ushbu QR kodni skanerlang:
        </p>
        <div style="background: #ffffff; padding: 12px; border-radius: 12px; display: inline-block; box-shadow: var(--shadow-sm);">
          <img id="login-qr-img" src="" alt="Login QR Code" style="width: 170px; height: 170px; display: block;">
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
